baseurl = "https://netzro.github.io/"
locale  = "en-us"
title   = "Gifted's Space"

defaultContentLanguage = "en"
hasCJKLanguage = false

[pagination]
    pagerSize = 10

[params]
    description = "A personal site by Gifted — movies, music, books, and links."
    env         = "production"
    feed        = "disabled"
    footer      = "custom"
    header      = "fixed"
    hero        = "disabled"
    mainSections = ["movies", "music", "books", "links"]

[params.logo]
    logo      = ""
    logoDark  = ""
    logoSmall = ""

[params.sidebar]
    emoji    = "🎬"
    subtitle = "Movies, music, books, and links."
    avatar   = ""

[params.article]
    readingTime   = true
    headingAnchor = false
    summary       = true

[params.widgets]
    homepage = []
    page     = []

[menu]
    [[menu.main]]
        name = "Movies"
        url  = "/movies/"
        weight = 1
    [[menu.main]]
        name = "Music"
        url  = "/music/"
        weight = 2
    [[menu.main]]
        name = "Reading"
        url  = "/reading-list/"
        weight = 3
    [[menu.main]]
        name = "Blogroll"
        url  = "/blogroll/"
        weight = 4

[colorScheme]
    toggle  = true
    default = "auto"